# System language and keyboard configuration
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'

# Network configuration (DHCP auto-activate)
network --bootproto=dhcp --device=link --activate

# Non-interactive text mode installation
text
firstboot --disable

# Lock the root account
rootpw --lock

# Create user 'mlops' with wheel privileges, locked password, and SSH key
user --name=mlops --groups=wheel --lock
sshkey --username=mlops "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/9+DZ691uuXblxWFazYlknbgJe6mQiNrSkTgqbuAhX mlops@server"

# Enable essential headless services
services --enabled="NetworkManager,sshd,salt-minion"

# Local Salt repo embedded in the ISO (see mkksiso --add salt-repo)
repo --name=salt-local --baseurl=file:///run/install/repo/salt-repo

# Fedora updates repo so the install pulls the latest package versions
repo --name=updates --metalink="https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch"

# System Storage Setup (Wipes all local drives)
zerombr
clearpart --all --initlabel
autopart

# Minimal Server Package Selection
%packages
@core
podman
tar
wget
curl
tree
net-tools
netstat
salt
salt-minion
%end

# Post-installation system configuration
%post
# Set default system target to multi-user text mode
systemctl set-default multi-user.target

# Pick the fastest mirror for DNF
grep -q '^fastestmirror=' /etc/dnf/dnf.conf || echo "fastestmirror=1" >> /etc/dnf/dnf.conf

# Extend the root logical volume to use all remaining free extents
lvextend --resizefs --extents +100%FREE /dev/mapper/fedora-root

# Grant passwordless sudo to the mlops user
echo "mlops ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/mlops
chmod 0440 /etc/sudoers.d/mlops

# Configure node identity from the DHCP address before Salt starts
cat > /usr/local/sbin/configure-salt-minion <<'SCRIPT'
#!/bin/bash
set -euo pipefail

addresses=$(ip -4 -o address show scope global)
node_name=
while read -r _ _ _ address _; do
    address=${address%/*}
    if [[ $address =~ ^192\.168\.202\.1([0-9])$ ]]; then
        candidate="mlops-node-${BASH_REMATCH[1]}"
        if [[ -n $node_name && $node_name != "$candidate" ]]; then
            echo "Multiple cluster node addresses found; refusing to configure Salt." >&2
            exit 1
        fi
        node_name=$candidate
    fi
done <<< "$addresses"

if [[ -z $node_name ]]; then
    echo "No cluster address in 192.168.202.10-19 found; refusing to configure Salt." >&2
    exit 1
fi

hostnamectl set-hostname "$node_name"
install -d -m 0755 /etc/salt/minion.d
cat > /etc/salt/minion.d/minion.conf <<CONFIG
id: $node_name
master: salt.ergoshear.dev
CONFIG
SCRIPT
chmod 0755 /usr/local/sbin/configure-salt-minion

mkdir -p /etc/systemd/system/salt-minion.service.d
cat > /etc/systemd/system/salt-minion.service.d/node-identity.conf <<'UNIT'
[Unit]
Wants=network-online.target
Requires=NetworkManager-wait-online.service
After=network-online.target NetworkManager-wait-online.service

[Service]
ExecStartPre=/usr/local/sbin/configure-salt-minion
UNIT
systemctl enable NetworkManager-wait-online.service
%end

# Update the installed system after configuration
%post --erroronfail --log=/root/ks-post-update.log
dnf update -y
%end
